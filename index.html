<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Die Königskatze</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d0b0a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: relative; width: 100vw; height: 100dvh; display: flex; align-items: center; justify-content: center; }
      #pause {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 6;
        width: 34px;
        height: 34px;
        border: 1px solid #5a4430;
        border-radius: 6px;
        background: rgba(18, 12, 11, 0.7);
        color: #f4ead0;
        font: 11px/1 'Press Start 2P', monospace;
        cursor: pointer;
        opacity: 0.75;
      }
      #pause:hover { opacity: 1; }
      /* Handy hochkant: Hinweis zum Drehen */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0d0b0a;
        color: #f0c030;
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #rotate span { display: block; font-size: 40px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      /* Rechtliche Links, nur auf dem Titelbildschirm sichtbar */
      #legal {
        position: fixed;
        right: 10px;
        bottom: 8px;
        z-index: 5;
        font: 11px/1.4 system-ui, sans-serif;
        color: #6a5a4a;
      }
      #legal a { color: #a89878; text-decoration: none; padding: 4px; }
      #legal a:hover { color: #f0c030; text-decoration: underline; }
      #legal.hidden { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"><button id="pause" type="button" aria-label="Pause">II</button></div>
    <nav id="legal"><a href="./impressum.html">Impressum</a> · <a href="./datenschutz.html">Datenschutz</a></nav>
    <div id="rotate"><div><span>📱</span>Bitte das Handy<br />quer halten</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
