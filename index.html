<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Harter Karter</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d0b0a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Spielfläche = sichtbarer Bereich ohne Notch/abgerundete Ecken. Feste Ränder statt 100vh/100dvh:
         ältere Handy-Browser kennen dvh nicht (Höhe 0), und vh ignoriert die ein- und ausfahrende Adressleiste.
         Zentriert wird nur von Phaser (autoCenter), nicht zusätzlich per CSS. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        overflow: hidden;
      }
      #game canvas { display: block; }
      #pause {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 6;
        width: 34px;
        height: 34px;
        border: 1px solid #5a4430;
        border-radius: 6px;
        background: rgba(18, 12, 11, 0.7);
        color: #f4ead0;
        font: 11px/1 'Press Start 2P', monospace;
        cursor: pointer;
        opacity: 0.75;
      }
      #pause:hover { opacity: 1; }
      /* Vollbild: links neben dem Pause-Knopf, nur solange das Pausenmenü offen ist */
      #full {
        position: absolute;
        top: 6px;
        right: 46px;
        z-index: 6;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid #5a4430;
        border-radius: 6px;
        background: rgba(18, 12, 11, 0.7);
        cursor: pointer;
        opacity: 0.75;
        display: grid;
        place-items: center;
      }
      #full:hover { opacity: 1; }
      #full.hidden { display: none; }
      #full svg { width: 20px; height: 20px; }
      #full .zu { display: none; }
      #full.an .auf { display: none; }
      #full.an .zu { display: inline; }
      /* im Vollbild füllt der Spielcontainer den ganzen Bildschirm */
      #game:fullscreen { inset: 0; background: #0d0b0a; }
      #inv {
        position: absolute;
        top: 46px;
        right: 6px;
        z-index: 6;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid #5a4430;
        border-radius: 6px;
        background: rgba(18, 12, 11, 0.7);
        color: #f4ead0;
        cursor: pointer;
        opacity: 0.75;
        display: grid;
        place-items: center;
      }
      #inv:hover { opacity: 1; }
      #inv.hidden { display: none; }
      #inv svg { width: 20px; height: 20px; }
      #inv span { position: absolute; right: 2px; bottom: 1px; font: 7px/1 'Press Start 2P', monospace; color: #f0c030; }
      /* Handy hochkant: Hinweis zum Drehen */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0d0b0a;
        color: #f0c030;
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #rotate span { display: block; font-size: 40px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      /* Rechtliche Links, nur auf dem Titelbildschirm sichtbar */
      #legal {
        position: fixed;
        right: calc(10px + env(safe-area-inset-right, 0px));
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 5;
        font: 11px/1.4 system-ui, sans-serif;
        color: #6a5a4a;
      }
      #legal a { color: #a89878; text-decoration: none; padding: 4px; }
      #legal a:hover { color: #f0c030; text-decoration: underline; }
      #legal.hidden { display: none; }
      /* sichtbare Meldung bei echten Ladefehlern (sonst sieht man auf dem Handy nur einen schwarzen Bildschirm) */
      #error {
        display: none;
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 20;
        padding: 8px 10px;
        border: 1px solid #c04040;
        border-radius: 6px;
        background: rgba(30, 8, 8, 0.92);
        color: #ffd0c0;
        font: 12px/1.4 system-ui, sans-serif;
      }
      #error.show { display: block; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"><button id="pause" type="button" aria-label="Pause">II</button><button id="full" class="hidden" type="button" aria-label="Vollbild (Taste F)" title="Vollbild (Taste F)"><svg viewBox="0 0 20 20" fill="none" stroke="#f4ead0" stroke-width="1.8" stroke-linecap="round"><path class="auf" d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><path class="zu" d="M7 3v4H3M17 7h-4V3M13 17v-4h4M3 13h4v4"/></svg></button><button id="inv" class="hidden" type="button" aria-label="Inventar (Taste I)" title="Inventar (Taste I)"><svg viewBox="0 0 20 20" fill="none" stroke="#f4ead0" stroke-width="1.6"><path d="M6 7V5a4 4 0 0 1 8 0v2"/><rect x="3" y="7" width="14" height="11" rx="2"/><path d="M3 11h14"/><rect x="8.5" y="10" width="3" height="3" fill="#f0c030" stroke="none"/></svg><span>I</span></button></div>
    <nav id="legal"><a href="./impressum.html">Impressum</a> · <a href="./datenschutz.html">Datenschutz</a> · <a href="./credits.html">Credits</a></nav>
    <div id="rotate"><div><span>📱</span>Bitte das Handy<br />quer halten</div></div>
    <div id="error" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
