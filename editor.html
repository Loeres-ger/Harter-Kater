<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Map-Editor – Harter Karter</title>
    <style>
      :root { --bg: #0d0b0a; --panel: #1a1210; --panel2: #241914; --line: #3a2a1e; --text: #e8dcc4; --muted: #a89878; --accent: #f0c030; --ok: #7ac05a; --bad: #e0403a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
      button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: #4a3818; border-color: var(--accent); color: #fff; }
      button.primary { background: #6a2a20; border-color: #a8342a; }
      .app { display: grid; grid-template-rows: 44px 1fr 24px; grid-template-columns: 54px 1fr 320px; height: 100%; }
      header { grid-column: 1 / 4; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font: 11px 'Press Start 2P', monospace; color: var(--accent); margin: 0 12px 0 0; white-space: nowrap; }
      header .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
      #tools { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
      #tools button { width: 40px; height: 36px; padding: 0; font-size: 16px; }
      #stage { position: relative; overflow: hidden; background: #050405; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
      aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
      .tabs { display: flex; gap: 2px; padding: 6px 6px 0; flex-wrap: wrap; }
      .tabs button { padding: 3px 7px; font-size: 12px; }
      #search { margin: 6px; }
      #library { flex: 1; overflow-y: auto; padding: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; align-content: start; }
      .item { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px; cursor: pointer; text-align: center; font-size: 10px; color: var(--muted); overflow: hidden; }
      .item canvas { display: block; margin: 0 auto 3px; image-rendering: pixelated; }
      .item.on { border-color: var(--accent); color: #fff; }
      .item.wide { grid-column: span 2; }
      .group { grid-column: 1 / -1; color: var(--accent); font-size: 11px; margin-top: 6px; text-transform: uppercase; letter-spacing: .06em; }
      section.box { border-top: 1px solid var(--line); padding: 8px; max-height: 42%; overflow-y: auto; }
      section.box h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      .row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
      .row label { min-width: 74px; color: var(--muted); }
      .row input[type=text], .row input[type=number], .row select { flex: 1; min-width: 0; }
      .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
      footer { grid-column: 1 / 4; display: flex; gap: 16px; align-items: center; padding: 0 10px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; }
      #msg { margin-left: auto; color: var(--ok); }
      #restore { position: absolute; left: 12px; top: 12px; background: #4a3818; border: 1px solid var(--accent); padding: 8px 10px; border-radius: 4px; display: none; gap: 8px; align-items: center; }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>MAP-EDITOR</h1>
        <select id="mapSelect" title="Karte"></select>
        <button id="undo" title="Rückgängig (Strg+Z)">↶</button>
        <button id="redo" title="Wiederherstellen (Strg+Y)">↷</button>
        <span class="sep"></span>
        <button id="save" class="primary" title="Ins Projekt speichern (alte Datei wird gesichert)">Speichern</button>
        <button id="saveAs" title="Als Kopie unter neuem Namen speichern">Kopie</button>
        <button id="open" title="Gespeicherte Karte oder Sicherung öffnen">Öffnen</button>
        <button id="export" title="Als JSON-Datei herunterladen">Export</button>
        <button id="import" title="JSON-Datei laden">Import</button>
        <input id="file" type="file" accept=".json,application/json" hidden />
        <span class="sep"></span>
        <button id="test" title="Diese Fassung im Spiel testen (Projektdatei bleibt unverändert)">▶ Testen</button>
        <label class="hint"><input id="testFrei" type="checkbox" /> nach Glanz-Mission</label>
        <span class="sep"></span>
        <label class="hint"><input id="snap" type="checkbox" checked /> Raster</label>
        <button id="grow" title="Karte erweitern">Karte erweitern</button>
      </header>
      <nav id="tools"></nav>
      <div id="stage"><canvas id="view"></canvas>
        <div id="restore"><span id="restoreText"></span><button id="restoreYes">Wiederherstellen</button><button id="restoreNo">Verwerfen</button></div>
      </div>
      <aside>
        <div class="tabs" id="tabs"></div>
        <input id="search" type="text" placeholder="Suchen …" />
        <div id="library"></div>
        <section class="box" id="props"><h2>Eigenschaften</h2><div id="propsBody" class="hint">Nichts ausgewählt.</div></section>
        <section class="box"><h2>Ebenen</h2><div class="layers" id="layers"></div></section>
      </aside>
      <footer><span id="pos">–</span><span id="toolHint"></span><span id="msg"></span></footer>
    </div>
    <div id="phaser" style="position:absolute;left:-9999px;width:8px;height:8px"></div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
