<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Oktopushirsch – Entwurf</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0a0608; color: #e8dcc4; font: 13px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; }
      #buehne canvas { image-rendering: pixelated; max-width: 100%; height: auto; display: block; }
      button { font: inherit; color: #e8dcc4; background: #241914; border: 1px solid #3a2a1e; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
      button:hover { border-color: #f0c030; }
      .knoepfe { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 900px; }
    </style>
  </head>
  <body>
    <div id="buehne"></div>
    <div class="knoepfe">
      <button id="auftauchen">Auftauchen</button> <button id="roehren">Röhren</button> <button id="schlag">Hufschlag</button>
      <button id="treffer">Treffer</button> <button id="brunft">Brunft an/aus</button> <button id="strahl">Augenstrahl</button>
      <button id="curry">Curry fressen</button> <button id="niederlage">Niederlage</button> <button id="neu">Neu</button>
    </div>
    <div><button id="nah">Nahansicht Kopf</button> <button id="png">Als PNG speichern</button></div>
    <script type="module" src="/src/monster/vorschau.ts"></script>
  </body>
</html>
